apiVersion: v1
kind: ConfigMap
metadata:
  name: catlogue
  namespace: roboshop
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catlogue
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: catlogue
spec:
  replicas: 6
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: catlogue
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: catlogue
    spec:
      containers:
      - name: catalogue
        image: manigangisetty/catalogue:4.0.0
        envFrom:
        - configMapRef:
            name: catalogue
        
---
apiVersion: v1
kind: Service
metadata:
  name: catlogue
  namespace: roboshop
  # servicer labels
  labels:
    project: roboshop
    tier: backend
    component: catlogue
spec:
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: backend
    component: catlogue
  ports:
    - protocol: TCP
      port: 8080   # service port
      targetPort: 8080 # container port

